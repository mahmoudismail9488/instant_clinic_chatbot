[project]
name = "instant-clinic-chatbot"
version = "0.1.0"
description = "Guideline-grounded clinical chatbot with admin source ingestion"
readme = "README.md"
authors = [
    { name = "Ahmed Nagah", email = "ahmednagah031220@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
    "pypdf>=5.1.0",
    "openai>=1.59.0",
    "numpy>=2.1.0",
    "python-dotenv>=1.0.0",
    "fastembed>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
clinic = "backend.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
