[project]
name = "glucorag"
version = "0.1.0"
description = "GlucoRAG — guideline-grounded diabetes clinical assistant"
readme = "README.md"
authors = [
    { name = "Ahmed Nagah", email = "ahmednagah031220@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
    "pypdf>=5.1.0",
    "openai>=1.59.0",
    "numpy>=2.1.0",
    "python-dotenv>=1.0.0",
    "fastembed>=0.5.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
# Lab-only (not needed in the production API image)
eval = [
    "pandas>=3.0.5",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
clinic = "backend.app.cli:main"
clinic-api = "backend.app.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
